name: Gemini packaged file tools
on:
  workflow_dispatch:
  push:
    branches: [codex/ios17-ai-clis]
    paths: ['gemini/**', '.github/workflows/gemini-host.yml']
permissions:
  contents: read
jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.12.1'
      - run: python3 gemini/build.py
      - run: node gemini/tests/host.mjs
      - run: node Resources/gemini/launcher.mjs --version
        env:
          GEMINI_CLI_NO_RELAUNCH: 'true'
