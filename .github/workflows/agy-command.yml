name: Native Antigravity a-Shell command
on:
  workflow_dispatch:
  push:
    branches: [codex/agy-ios-port]
    paths: [agy/**, .github/workflows/agy-command.yml]
permissions:
  contents: read
jobs:
  command:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify pinned engine and build dependencies
        run: |
          mkdir -p .build/agy/ios
          cd .build/agy
          curl -fLsS --retry 3 https://github.com/google-antigravity/antigravity-cli/releases/download/1.5.9/agy_cli_mac_arm64.tar.gz -o engine.tgz
          echo '51fb8eb7e18c53d4665f0043b761f04f4d0d4b2eb046bac6c2dcbe32473b5b2e  engine.tgz' | shasum -a 256 -c -
          tar -xzf engine.tgz
          curl -fLsS --retry 3 https://codeload.github.com/holzschu/ios_system/tar.gz/df998e76cea0266bd3615bb9a1f4f7d745f318a2 -o ios.tgz
          echo '6d2201c1dee131b831b8108b578ede560277d1c205fd8c64f2fb9dcd70e7baca  ios.tgz' | shasum -a 256 -c -
          tar -xzf ios.tgz -C ios --strip-components=1
          for patch in ios-system-node-stack ios-system-wait-cancel; do
            patch -F 0 -p1 -d ios < "../../node/$patch.patch"
          done
      - name: Build device and simulator command frameworks
        run: |
          root="$PWD/.build/agy"
          for sdk in iphoneos iphonesimulator; do
            ios="$root/$sdk/sdk"
            xcodebuild -project "$root/ios/ios_system.xcodeproj" -target ios_system -configuration Release -sdk "$sdk" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO IPHONEOS_DEPLOYMENT_TARGET=16.0 CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR="$ios" build > "$root/$sdk.log" 2>&1 || { tail -80 "$root/$sdk.log"; exit 1; }
            bash agy/build-command.sh "$sdk" "$root/antigravity" "$ios" "$root/$sdk/Frameworks"
          done
          cd "$root/iphoneos/Frameworks"
          zip -qry "$root/agy-frameworks-ios17.zip" *.framework
      - name: Test original TUI from ios_system
        run: bash agy/test-command.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: agy-command-test
          path: .build/agy/iphonesimulator/*-*.txt
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v6
        with:
          name: agy-native-frameworks
          path: .build/agy/agy-frameworks-ios17.zip
          compression-level: 0
