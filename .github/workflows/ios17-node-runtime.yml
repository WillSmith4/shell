name: Native Node and Gemini runtime checks
on:
  workflow_dispatch:
    inputs:
      node_run:
        description: Successful Node framework run ID
        required: true
      debug_native:
        description: Capture the native failure under LLDB
        type: boolean
        default: false
      runner:
        description: macOS runner image
        type: choice
        options: [macos-26, xcode-27]
        default: macos-26
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          run-id: ${{ inputs.node_run }}
          github-token: ${{ github.token }}
          name: node-simulator
          path: .build/test-input
      - name: Run native command harness
        env:
          ASHELL_NATIVE_DEBUG: ${{ inputs.debug_native && '1' || '0' }}
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > .build/devices.json
          device=$(python3 -c 'import json; d=json.load(open(".build/devices.json")); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["isAvailable"]))')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          bash node/tests/runtime.sh "$device" "$PWD/.build/test-input/node-simulator.tar.gz"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-runtime-logs
          path: |
            .build/node-runtime/runtime-*.txt
            .build/node-runtime/dash-build/*.log
            .build/node-runtime/crashes/*
          if-no-files-found: ignore
